<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Tienda de Móviles</title>
    <link rel='stylesheet' href='src/css/style.css'>
</head>
<body>
    <header id="top-section">
        <div class="container">
            <div class="logo">TiendaMóvil</div>
            <nav>
                <ul>
                    <li><a href="#top-section">Inicio</a></li>
                    <li><a href="#product-list-section">Productos</a></li>
                    <li><a href="#footer-section">Contacto</a></li>
                </ul>
            </nav>
            <div class="user-actions">
                <button id="login-button">Login</button>
            </div>
        </div>
    </header>
    <main>
        <div class="container" id="main-content">
            <h1>Bienvenido a nuestra tienda</h1>
            <section id="product-list-section"><h2>Nuestros Productos</h2><div id="product-list" class="product-grid"></div></section>
            <!-- Más contenido se añadirá aquí -->
        </div>
    </main>
    <footer id="footer-section">
        <div class="container">
            <p>&copy; 2024 TiendaMóvil. Todos los derechos reservados.</p>
            <p>Contacto: info@tiendamovil.com</p>
        </div>
    </footer>
    <script src='src/js/products.js'></script>
    <script src='src/js/app.js'></script>

    <!-- Modal de Login -->
    <div id="login-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2>Iniciar Sesión</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="button-primary">Login</button>
                <p id="login-message" class="login-message" style="display: none;"></p>
            </form>
        </div>
    </div>
</body>
</html>
